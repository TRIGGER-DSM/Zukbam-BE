name: CD
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: '배포할 태그 (예: v1.0.0)'
        required: true

permissions:
  contents: read

concurrency:
  group: prod-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, prod]
    environment: prod
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - name: Verify tag is on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main || { echo "태그 $TAG 는 main에 포함되어 있지 않습니다"; exit 1; }

      - name: Deploy
        env:
          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JPA_DDL_AUTO: validate
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          AUTH_TEACHER_CODE: ${{ secrets.AUTH_TEACHER_CODE }}
          SWAGGER_USERNAME: ${{ secrets.SWAGGER_USERNAME }}
          SWAGGER_PASSWORD: ${{ secrets.SWAGGER_PASSWORD }}
          JUDGE0_DB_PASSWORD: ${{ secrets.JUDGE0_DB_PASSWORD }}
          JUDGE0_REDIS_PASSWORD: ${{ secrets.JUDGE0_REDIS_PASSWORD }}
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_ENV: ${{ vars.DD_ENV }}
          DD_HOSTNAME: ${{ vars.DD_HOSTNAME }}
        run: |
          export APP_IMAGE=zukbam-be:$TAG
          docker build --build-arg DD_VERSION="$TAG" -t "$APP_IMAGE" .
          # 쉬고 있는 색을 새 버전으로 띄우고, 준비되면 proxy를 돌린 뒤 이전 색을 내린다
          ./deploy/blue-green.sh
          docker image prune -f
