name: Deploy
on:
  push:
    branches: [main, develop]

jobs:
  build-and-deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build
        run: ./gradlew build -x test

      - name: Build Docker image
        run: docker build -t myapp:latest .

      - name: Deploy
        run: |
          cd ~/trigger
          docker compose down
          docker compose up -d