spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/zukbam}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:true}

jwt:
  secret: ${JWT_SECRET:zukbam-local-secret-key-must-be-at-least-32-bytes}
