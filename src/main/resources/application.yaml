spring:
  application:
    name: Zukbam-BE

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # 스키마는 Flyway(db/migration)가 관리한다. 이미 테이블이 있는 운영 DB는 V1으로 간주하고 V2부터 적용한다
  flyway:
    baseline-on-migrate: true
    baseline-version: 1

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: ${JPA_SHOW_SQL:false}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  # 종료할 때 처리 중인 요청과 채점이 끝나기를 기다리는 최대 시간.
  # 채점 대기열은 메모리에만 있어서, 이 시간을 넘긴 채점은 PENDING으로 남았다가 다음 기동 때 다시 채점된다.
  # judge0.idle-timeout(2분)보다 길어야 하고, docker-compose.yml의 stop_grace_period보다는 짧아야 한다
  lifecycle:
    timeout-per-shutdown-phase: 150s

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

# HTTPS 프록시 뒤에서 원래 요청의 스킴·호스트를 X-Forwarded-* 헤더로 인식한다 (Swagger 서버 주소가 http로 잡히지 않도록)
server:
  forward-headers-strategy: framework
  # 종료 신호를 받으면 새 요청은 받지 않고 처리 중인 요청을 끝낸 뒤 내려간다
  shutdown: graceful

# 헬스체크만 연다. 배포 스크립트는 /actuator/health/readiness로 새 인스턴스가 준비됐는지 확인한다
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
  health:
    # 헬스체크마다 SMTP 서버에 접속하지 않도록 끈다
    mail:
      enabled: false

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    tags-sorter: alpha
    operations-sorter: method
    persist-authorization: true
  default-produces-media-type: application/json
  override-with-generic-response: false

swagger:
  auth:
    username: ${SWAGGER_USERNAME:}
    password: ${SWAGGER_PASSWORD:}

jwt:
  header: ${JWT_HEADER:Authorization}
  prefix: ${JWT_PREFIX:Bearer }
  secret: ${JWT_SECRET}
  access-exp: ${JWT_ACCESS_EXP:1209600}
  refresh-exp: ${JWT_REFRESH_EXP:1209600}

auth:
  email:
    verified-token-exp: ${AUTH_EMAIL_VERIFIED_TOKEN_EXP:1800}
  teacher:
    code: ${AUTH_TEACHER_CODE:}

judge0:
  url: ${JUDGE0_URL:http://localhost:2358}
  poll-interval: ${JUDGE0_POLL_INTERVAL:1s}
  request-timeout: ${JUDGE0_REQUEST_TIMEOUT:5s}
  idle-timeout: ${JUDGE0_IDLE_TIMEOUT:2m}

# Datadog Log Pipeline(Grok)이 이 형식을 파싱한다. 바꾸면 monitoring/datadog/logs/pipeline.json 도 함께 바꿀 것
# dd.trace_id/dd.span_id 는 dd-java-agent(DD_LOGS_INJECTION)가 MDC에 넣어 주며, 에이전트가 없으면 0으로 남는다
logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSZ} %5p [%t] [dd.trace_id=%X{dd.trace_id:-0} dd.span_id=%X{dd.span_id:-0}] %logger{39} : %m%n%wEx"
