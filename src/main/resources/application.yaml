spring:
  application:
    name: Zukbam-BE

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  sql:
    init:
      mode: always
      schema-locations: classpath:db/unique-indexes.sql,classpath:db/rank-migration.sql
      separator: "@@"

  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: ${JPA_SHOW_SQL:false}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    tags-sorter: alpha
    operations-sorter: method
    persist-authorization: true
  default-produces-media-type: application/json
  override-with-generic-response: false

jwt:
  header: ${JWT_HEADER:Authorization}
  prefix: ${JWT_PREFIX:Bearer }
  secret: ${JWT_SECRET}
  access-exp: ${JWT_ACCESS_EXP:3600}
  refresh-exp: ${JWT_REFRESH_EXP:1209600}

auth:
  email:
    verified-token-exp: ${AUTH_EMAIL_VERIFIED_TOKEN_EXP:1800}
  teacher:
    code: ${AUTH_TEACHER_CODE:}

judge0:
  url: ${JUDGE0_URL:http://localhost:2358}
  poll-interval: ${JUDGE0_POLL_INTERVAL:1s}
  request-timeout: ${JUDGE0_REQUEST_TIMEOUT:5s}
  idle-timeout: ${JUDGE0_IDLE_TIMEOUT:2m}

# Datadog Log Pipeline(Grok)이 이 형식을 파싱한다. 바꾸면 monitoring/datadog/logs/pipeline.json 도 함께 바꿀 것
# dd.trace_id/dd.span_id 는 dd-java-agent(DD_LOGS_INJECTION)가 MDC에 넣어 주며, 에이전트가 없으면 0으로 남는다
logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSZ} %5p [%t] [dd.trace_id=%X{dd.trace_id:-0} dd.span_id=%X{dd.span_id:-0}] %logger{39} : %m%n%wEx"
