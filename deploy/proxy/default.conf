# 외부 요청을 지금 살아 있는 색(backend-blue 또는 backend-green)으로 넘긴다

server {
    listen 80;

    # 컨테이너 이름을 요청 시점에 Docker 내장 DNS로 찾는다.
    # 그래야 쉬고 있는 색이 없어도 nginx가 뜨고, 컨테이너가 다시 떠서 IP가 바뀌어도 따라간다
    resolver 127.0.0.11 valid=5s ipv6=off;

    # `set $backend_host backend-blue;` 한 줄이 들어 있다. switch-color가 바꾼다
    include /etc/nginx/state/active.conf;

    client_max_body_size 2m;

    # 헬스체크는 서버 안에서만 쓴다. 배포 스크립트가 전환 뒤 proxy를 거쳐 확인할 때만 연다
    location /actuator {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://$backend_host:8080;
    }

    location / {
        proxy_pass http://$backend_host:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # 앞단 프록시가 넣어 준 X-Forwarded-Proto/Host는 그대로 전달된다 (Swagger 서버 주소가 https로 잡히는 근거)
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # 코드 실행처럼 Judge0 응답을 기다리는 API가 중간에 끊기지 않게 한다
        proxy_read_timeout 130s;
    }
}
